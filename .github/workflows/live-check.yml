# D128: uptime monitoring. Every 30 minutes the read-only live checks (GET/HEAD only, no sign-in, no data)
# run against the hosted site. A failure turns this workflow red and GitHub emails the repository owner.
# One retry after 5 minutes avoids false alarms while a deploy is still rolling out.
name: Safeer live site check
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Live checks
        run: |
          node scripts/check-live.mjs && exit 0
          echo "First attempt failed; retrying in 5 minutes in case a deploy was in progress."
          sleep 300
          node scripts/check-live.mjs
