name: safeer_core
description: Shared Safeer theme, fonts, strings, models, API client, demo data and widgets.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-700.ttf
          weight: 700
