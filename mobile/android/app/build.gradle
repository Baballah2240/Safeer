plugins { id 'com.android.application' }

// Store builds: -PsafeerOrigin=https://your.domain (HTTPS only). Upload signing comes from a private
// properties file outside Git (default %USERPROFILE%/.android/safeer-upload.properties).
def storeOrigin = (project.findProperty('safeerOrigin') ?: '').toString()
def uploadFile = file((project.findProperty('safeerUploadProperties') ?: System.getProperty('user.home') + '/.android/safeer-upload.properties').toString())
def upload = new Properties()
if (uploadFile.exists()) uploadFile.withInputStream { upload.load(it) }

android {
    namespace 'sd.safeer.mobile'
    compileSdk 35
    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode 17000
        versionName '0.17.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        play {
            if (upload.storeFile) {
                storeFile file(upload.storeFile)
                storePassword upload.storePassword
                keyAlias upload.keyAlias
                keyPassword upload.keyPassword
            }
        }
    }
    flavorDimensions += 'workspace'
    productFlavors {
        driver {
            versionCode 18001
            versionName '0.18.1'
            dimension 'workspace'
            applicationId 'sd.safeer.driver'
            resValue 'string', 'app_name', 'Safeer Driver'
            buildConfigField 'String', 'START_PATH', '"/driver"'
        }
        booking {
            dimension 'workspace'
            applicationId 'sd.safeer.booking'
            resValue 'string', 'app_name', 'Safeer Booking'
            buildConfigField 'String', 'START_PATH', '"/marketplace"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            versionNameSuffix '-usb'
            // USB test channel: the computer's loopback service through adb reverse.
            buildConfigField 'String', 'ORIGIN', '"http://127.0.0.1:4320"'
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'ORIGIN', '"' + storeOrigin + '"'
            if (upload.storeFile) signingConfig signingConfigs.play
        }
    }
}
